<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYS14 Admin Login</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="login" class="auth-page">
    <main class="auth-shell">
      <section class="auth-card">
        <div class="brand-row">
          <div class="brand-icon">S</div>
          <div>
            <p class="eyebrow">Virtual Assistant Operations</p>
            <h1>SYS14</h1>
          </div>
        </div>

        <h2>IT Admin Sign In</h2>
        <p class="subtext">Use your work email and password.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" required />
              <button type="button" id="togglePassword" aria-label="Show password">Show</button>
            </div>
          </div>

          <div class="row between">
            <label class="checkbox-row">
              <input id="rememberMe" type="checkbox" checked />
              <span>Remember Me</span>
            </label>
          </div>

          <button id="loginButton" class="primary-button" type="submit">Log in</button>
          <div id="authError" class="form-error" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      window.__SUPABASE_CONFIG__ = {
        url: 'https://your-project.supabase.co',
        anonKey: 'your-anon-key'
      };
    </script>
    <script src="./app.js"></script>
  </body>
</html>
