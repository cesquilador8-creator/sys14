<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYS14 Extension</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-body">
    <div class="popup-shell">
      <div class="popup-header">
        <h2>SYS14</h2>
        <button id="signOutButton" class="text-button">Sign out</button>
      </div>

      <div id="statusBadge" class="badge offline">Not signed in</div>
      <div class="section-block">
        <div class="label">Enrollment</div>
        <div id="enrollmentStatus">Checking...</div>
      </div>
      <div class="section-block">
        <div class="label">Assigned laptop</div>
        <div id="assignedLaptop">Unknown</div>
      </div>
      <div class="section-block">
        <div class="label">Blocking status</div>
        <div id="blockingStatus">Unknown</div>
      </div>
      <div class="section-block">
        <div class="label">Last sync</div>
        <div id="lastSync">Unavailable</div>
      </div>

      <div class="popup-links">
        <button class="primary-button" id="usageButton">Usage Summary</button>
        <button class="secondary-button" id="ticketsButton">My Tickets</button>
      </div>

      <div class="popup-links">
        <button class="secondary-button" id="settingsButton">Settings</button>
        <button class="secondary-button" id="reportButton">Report Issue</button>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
